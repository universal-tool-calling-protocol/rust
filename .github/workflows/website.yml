name: Website

on:
  push:
    branches: [main, master]
    paths: ["website/**", "package.json", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", "package.json", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: rust-utcp-website
          path: website/dist
